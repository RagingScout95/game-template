spring:
  application:
    name: scenario-game-engine
  
  datasource:
    url: jdbc:postgresql://localhost:5432/game_tamplate
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
  
  security:
    jwt:
      secret: "your-secret-key-change-this-in-production-make-it-at-least-256-bits"
      expiration: 86400000 # 24 hours

server:
  port: 8080

logging:
  level:
    com.pixelgame: DEBUG
    org.springframework.graphql: DEBUG

